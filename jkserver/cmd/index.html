<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JKRouter — Dashboard</title>
<style>
:root {
  --base:#1e1e2e; --mantle:#181825; --crust:#11111b; --s0:#313244; --s1:#45475a;
  --blue:#89b4fa; --lav:#b4befe; --grn:#a6e3a1; --md:#cba6f7; --yel:#f9e2af;
  --red:#f38ba8; --txt:#cdd6f4; --mut:#9399b2;
  font-size:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--base);color:var(--txt);font-family:ui-monospace,'Cascadia Code','JetBrains Mono',monospace;font-size:.85rem;line-height:1.5}
a{color:inherit;text-decoration:none}

/* ── layout ── */
.app{display:grid;grid-template-columns:190px 1fr;min-height:100vh}
.nav{background:var(--mantle);border-right:1px solid var(--s1);padding:.8rem .5rem;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;width:190px;overflow-y:auto}
.nav .logo{font-weight:700;color:var(--blue);font-size:1rem;padding:.3rem .5rem .6rem;border-bottom:1px solid var(--s1);margin-bottom:.5rem}
.nav .sec{font-size:.6rem;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;margin:.6rem 0 .15rem .5rem}
.nav a{display:block;color:var(--mut);padding:.35rem .5rem;border-radius:6px;font-size:.8rem;transition:background .15s,color .15s}
.nav a:hover{background:var(--s0);color:var(--txt)}
.nav a.on{background:var(--s0);color:var(--txt)}
.main{padding:1.2rem 1.5rem;overflow-y:auto}

/* ── components ── */
.card{background:var(--s0);border:1px solid var(--s1);border-radius:8px;padding:.9rem;margin-bottom:.8rem}
.card h3{font-size:.9rem;color:var(--lav);margin-bottom:.5rem;font-weight:600}
.page-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1rem}
.page-head h2{font-size:1.1rem;color:var(--lav);font-weight:600}
.page-head small{color:var(--mut);font-size:.75rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap}
.flex-between{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem}

/* badges / status */
.st{display:inline-block;font-size:.68rem;padding:.1rem .45rem;border-radius:99px;border:1px solid transparent}
.st.active,.st.ok{background:#a6e3a122;color:var(--grn);border-color:var(--grn)}
.st.cooling{background:#f9e2af22;color:var(--yel);border-color:var(--yel)}
.st.disabled,.st.err{background:#f38ba822;color:var(--red);border-color:var(--red)}

/* chips / tags */
.chip{border:1px dashed var(--s1);border-radius:6px;padding:.2rem .5rem;font-size:.72rem;color:var(--mut);cursor:pointer;transition:all .15s}
.chip:hover{border-style:solid;background:var(--s1);color:var(--txt)}
.chip.fill{border-style:solid;background:var(--s1);color:var(--txt)}

/* buttons */
.btn{display:inline-block;padding:.3rem .7rem;border-radius:6px;font-size:.75rem;font-weight:600;cursor:pointer;border:none;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:var(--blue);color:var(--crust)}
.btn-ghost{background:transparent;border:1px solid var(--s1);color:var(--txt)}
.btn-danger{background:transparent;border:1px solid var(--red);color:var(--red);padding:.2rem .5rem;font-size:.7rem;border-radius:5px;cursor:pointer}
.btn-sm{padding:.2rem .5rem;font-size:.72rem}

/* inputs */
.input{border:1px solid var(--s1);border-radius:6px;padding:.3rem .6rem;font-size:.8rem;color:var(--txt);background:var(--crust);outline:none;font-family:inherit;width:100%}
.input:focus{border-color:var(--blue)}
.select{border:1px solid var(--s1);border-radius:6px;padding:.3rem .5rem;font-size:.8rem;color:var(--txt);background:var(--crust);font-family:inherit}

/* table */
table{width:100%;border-collapse:collapse;font-size:.8rem}
th{text-align:left;color:var(--mut);font-weight:400;border-bottom:1px solid var(--s1);padding:.4rem .3rem;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em}
td{padding:.4rem .3rem;border-bottom:1px solid #31324460;vertical-align:middle}
tr:hover td{background:#ffffff06}

/* notes / helper */
.note{font-size:.7rem;color:var(--mut);margin-top:.4rem}
.hidden{display:none!important}
.kv{display:grid;grid-template-columns:130px 1fr;gap:.2rem .8rem;font-size:.8rem}
.kv dt{color:var(--mut)}
.kv dd{color:var(--txt);word-break:break-all}
.bar{height:6px;background:var(--s1);border-radius:99px;overflow:hidden;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--blue)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem}
.stat .n{font-size:1.5rem;color:var(--blue);font-weight:700}
.stat .l{font-size:.65rem;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
pre{background:var(--crust);border:1px solid var(--s1);border-radius:6px;padding:.6rem;font-size:.72rem;overflow:auto;color:var(--yel);white-space:pre-wrap;word-break:break-all}
code{background:var(--s1);padding:.1rem .3rem;border-radius:4px;font-size:.75rem;color:var(--yel)}

/* search */
.search{border:1px solid var(--s1);border-radius:6px;padding:.3rem .6rem;font-size:.8rem;color:var(--mut);background:var(--crust);font-family:inherit}
.search:focus{border-color:var(--blue);color:var(--txt);outline:none}

/* tabs */
.tabs{display:flex;gap:1rem;border-bottom:1px solid var(--s1);margin-bottom:.8rem;font-size:.8rem}
.tabs span{color:var(--mut);padding:.3rem 0;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tabs span:hover{color:var(--txt)}
.tabs span.on{color:var(--blue);border-bottom-color:var(--blue)}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- Sidebar -->
  <nav class="nav">
    <div class="logo">jkROUTER</div>
    <div class="sec">Routing</div>
    <a href="#/providers"    data-route="/providers">Providers</a>
    <a href="#/connections"  data-route="/connections">Connections</a>
    <a href="#/combos"       data-route="/combos">Combos</a>
    <a href="#/endpoint"     data-route="/endpoint">Endpoint</a>
    <div class="sec">Infrastructure</div>
    <a href="#/proxy-pools"  data-route="/proxy-pools">Proxy Pools</a>
    <a href="#/usage"        data-route="/usage">Usage &amp; Logs</a>
    <div class="sec">System</div>
    <a href="#/api-keys"     data-route="/api-keys">API Keys</a>
    <a href="#/settings"     data-route="/settings">Settings</a>
    <a href="#/profile"      data-route="/profile">Profile</a>
    <div style="margin-top:auto;padding:.6rem .5rem;font-size:.65rem;color:var(--mut)" id="version-badge"></div>
  </nav>

  <!-- Main -->
  <main class="main">
    <div id="content"></div>
  </main>
</div>

<script>
// ── Router ──
const routes = {
  '/':            renderDashboard,
  '/providers':   renderProviders,
  '/connections': renderConnections,
  '/combos':      renderCombos,
  '/proxy-pools': renderProxyPools,
  '/api-keys':    renderAPIKeys,
  '/usage':       renderUsage,
  '/settings':    renderSettings,
  '/endpoint':    renderEndpoint,
  '/profile':     renderProfile,
};

function navigate(path) {
  path = path || '/';
  document.querySelectorAll('.nav a').forEach(a => {
    a.classList.toggle('on', a.dataset.route === path);
  });
  const el = document.getElementById('content');
  el.innerHTML = (routes[path] ? routes[path]() : '<p class="note">Halaman tidak ditemukan.</p>');
  // run inline scripts
  el.querySelectorAll('script').forEach(s => {
    const code = s.textContent || s.innerHTML;
    if (code.trim()) { try { new Function(code)(); } catch(e) { console.error(e); } }
  });
}
window.addEventListener('hashchange', () => navigate(location.hash.slice(1) || '/'));
window.addEventListener('load',      () => navigate(location.hash.slice(1) || '/'));

// ── Helpers ──
async function api(path, opts={}) {
  const r = await fetch(`/api/dashboard${path}`, opts);
  return r.json();
}
function toggleForm(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('hidden');
}
function escapeHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ══════════════════════════════════════
//  Pages
// ══════════════════════════════════════

function renderDashboard() {
  return `
    <div class="page-head">
      <h2>Dashboard</h2>
      <span class="note" id="conn-status"></span>
    </div>
    <div id="stats" class="grid4 mb-6">
      <div class="card stat"><div class="n" id="s-total">-</div><div class="l">Requests / 7d</div></div>
      <div class="card stat"><div class="n" id="s-success" style="color:var(--grn)">-</div><div class="l">Success</div></div>
      <div class="card stat"><div class="n" id="s-errors" style="color:var(--red)">-</div><div class="l">Errors</div></div>
      <div class="card stat"><div class="n" id="s-cost" style="color:var(--yel)">$0</div><div class="l">Est. Cost / 7d</div></div>
    </div>
    <div class="card">
      <h3>Recent Requests</h3>
      <table>
        <thead><tr>
          <th>Time</th><th>Request</th><th>Model</th><th>Provider</th>
          <th>Status</th><th>Latency</th><th>Tokens</th>
        </tr></thead>

      </table>
    </div>`;
}

// ══════════════════════════════════════
//  Data loaders (inline <script> blocks)
// ══════════════════════════════════════

// ── Dashboard stats ──
(function(){
  const el = document.getElementById('stats');
  if(!el) return;
  (async()=>{
    const [u,c]=await Promise.all([api('/usage'), api('/usage/cost')]);
    const usage=u.usage||[];
    const total=usage.length;
    const success=usage.filter(x=>x.status==='success').length;
    const errors=total-success;
    const cost=(c.costs||[]).reduce((s,x)=>s+(x.cost_usd||0),0).toFixed(4);
    document.getElementById('s-total').textContent=total.toLocaleString();
    document.getElementById('s-success').textContent=success.toLocaleString();
    document.getElementById('s-errors').textContent=errors.toLocaleString();
    document.getElementById('s-cost').textContent='$'+cost;
    const tbody=document.getElementById('recent-tbody');
    if(!tbody) return;
    tbody.innerHTML=(usage.slice(0,15)||[]).map(r=>`<tr>
      <td class="note">${(r.ts||'').slice(11,19)}</td>
      <td class="font-mono text-xs">${escapeHtml(r.request_id||'—')}</td>
      <td class="font-mono text-xs">${escapeHtml(r.model||'—')}</td>
      <td>${escapeHtml(r.provider||'—')}</td>
      <td><span class="st ${r.status==='success'?'ok':'err'}">${escapeHtml(r.status||'?')}</span></td>
      <td>${r.latency_ms}ms</td>
      <td class="font-mono text-xs">${r.tok_in}+${r.tok_out}</td>
    </tr>`).join('')||'<tr><td colspan="7" class="note">No data</td></tr>';
  })();
})();

// ── Providers ──
(function(){
  const tbody=document.getElementById('providers-tbody');
  if(!tbody) return;
  (async()=>{
    const r=await api('/providers');
    const list=r.providers||[];
    tbody.innerHTML=list.map(p=>`<tr>
      <td class="font-medium">${escapeHtml(p.label)}</td>
      <td><span class="chip fill">${escapeHtml(p.auth_type)}</span></td>
      <td class="font-mono text-xs">${escapeHtml(p.base_url)}</td>
      <td><button class="btn-danger" onclick="deleteProvider(${p.id})">Delete</button></td>
    </tr>`).join('')||'<tr><td colspan="4" class="note">No providers</td></tr>';
  })();
  window.createProvider=async function(){
    const label=document.getElementById('p-label').value.trim();
    const base_url=document.getElementById('p-url').value.trim();
    const auth_type=document.getElementById('p-auth').value;
    if(!label||!base_url)return alert('Label dan Base URL wajib diisi');
    await api('/providers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({label,base_url,auth_type})});
    toggleForm('provider-form');
    location.hash='/providers';
  };
  window.deleteProvider=async function(id){
    if(!confirm('Hapus provider ini?'))return;
    await api(`/providers/${id}`,{method:'DELETE'});
    location.hash='/providers';
  };
})();

// ── Connections ──

// ── Combos ──
(function(){

// ── Proxy Pools ──
(function(){

// ── API Keys ──
(function(){

// ── Usage ──
(function(){
  const statsEl=document.getElementById('usage-stats');
  const tbody=document.getElementById('usage-tbody');
  if(!tbody) return;
  (async(()=>{
    const [u,c]=await Promise.all([api('/usage'), api('/usage/cost')]);
    const usage=u.usage||[];
    const total=usage.length;
    const success=usage.filter(x=>x.status==='success').length;
    const errors=total-success;
    const cost=(c.costs||[]).reduce((s,x)=>s+(x.cost_usd||0),0).toFixed(4);
    if(statsEl){
      statsEl.innerHTML=`
        <div class="card stat"><div class="n">${total}</div><div class="l">Requests / 7d</div></div>
        <div class="card stat"><div class="n" style="color:var(--grn)">${success}</div><div class="l">Success</div></div>
        <div class="card stat"><div class="n" style="color:var(--red)">${errors}</div><div class="l">Errors</div></div>
        <div class="card stat"><div class="n" style="color:var(--yel)">$${cost}</div><div class="l">Est. Cost</div></div>`;
    }
    tbody.innerHTML=usage.map(r=>`<tr>
      <td class="note">${(r.ts||'').slice(11,19)}</td>
      <td class="font-mono text-xs">${escapeHtml(r.request_id||'—')}</td>
      <td class="font-mono text-xs">${escapeHtml(r.model||'—')}</td>
      <td>${escapeHtml(r.provider||'—')}</td>
      <td><span class="st ${r.status==='success'?'ok':'err'}">${escapeHtml(r.status||'?')}</span></td>
      <td>${r.latency_ms}ms</td>
      <td class="font-mono text-xs">${r.tok_in}+${r.tok_out}</td>
    </tr>`).join('')||'<tr><td colspan="7" class="note">No usage data</td></tr>';
  })());
})();

// ── Export / Import ──
window.exportConfig=async function(){
  try {
    const r=await fetch('/api/dashboard/health');
    const d=await r.json();
    const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='jkrouter-config.json';
    a.click();
  } catch(e) { alert('Export failed: '+e.message); }
};
window.importConfig=function(e){
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try {
      const d=JSON.parse(ev.target.result);
      fetch('/api/dashboard/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})
        .then(r=>r.json()).then(()=>alert('Import berhasil! Restart diperlukan.'))
        .catch(err=>alert('Import gagal: '+err.message));
    } catch(err) { alert('File JSON tidak valid'); }
  };
  reader.readAsText(file);
};
</script>
