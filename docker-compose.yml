services:
  jkrouter:
    build:
      context: .
      args:
        VERSION: "dev"
    image: jkrouter:latest
    container_name: jkrouter
    ports:
      - "20128:20128"
    volumes:
      - jkrouter-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:20128/api/dashboard/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  jkrouter-data:
