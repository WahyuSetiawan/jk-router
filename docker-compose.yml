services:
  jkrouter:
    build:
      context: .
      args:
        VERSION: "dev"
    image: jkrouter:latest
    container_name: jkrouter
    ports:
      - "${PORT:-20128}:${PORT:-20128}"
    volumes:
      - jkrouter-data:/data
    env_file:
      - .env
    environment:
      - PORT=${PORT:-20128}
      - DATA_DIR=/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${PORT:-20128}/api/dashboard/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - jkrouter-net

volumes:
  jkrouter-data:
    name: jkrouter-data

networks:
  jkrouter-net:
    driver: bridge
